name: Gerar locução (ElevenLabs)

on:
  workflow_dispatch:
    inputs:
      idiomas:
        description: "Idiomas separados por vírgula (es, it, pt, en)"
        default: "pt,en,es,it"
        required: true
      somente_estimar:
        description: "Só calcular o custo, sem gerar"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Gerar áudios e salvar no repositório
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          IDIOMAS: ${{ inputs.idiomas }}
          SO_ESTIMAR: ${{ inputs.somente_estimar }}
        run: |
          if [ "$SO_ESTIMAR" = "true" ]; then
            echo "Modo só estimar: nada será gerado."
            node scripts/gerar-audios.mjs --idiomas "$IDIOMAS" --estimar
            exit 0
          fi
          node scripts/gerar-audios.mjs --idiomas "$IDIOMAS"
          git config user.name "kidoria-bot"
          git config user.email "kidoria-bot@users.noreply.github.com"
          git add app/audio
          git diff --cached --quiet && echo "Nada novo." && exit 0
          git commit -m "Locução ElevenLabs: $IDIOMAS"
          git push
